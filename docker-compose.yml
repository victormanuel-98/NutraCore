services:
  mongo:
    image: mongo:7
    container_name: nutracore-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutracore-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
      - ./backend/.env.docker
    environment:
      CLIENT_URL: http://localhost:${DOCKER_FRONTEND_PORT:-5174}
      CORS_ORIGINS: http://localhost:${DOCKER_FRONTEND_PORT:-5174}
    depends_on:
      - mongo
    ports:
      - "${DOCKER_BACKEND_PORT:-5001}:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nutracore-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${DOCKER_BACKEND_PORT:-5001}/api
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    ports:
      - "${DOCKER_FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  sonarqube-db:
    image: postgres:15
    container_name: nutracore-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: nutracore-sonarqube
    restart: unless-stopped
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  mongo_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
